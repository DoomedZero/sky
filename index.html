<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sky</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="logo">
        <h1>sky</h1>
    </div>

    <main id="main">

    </main>

    <div class="sun" id="sun"></div>

    <div class="hidden" id="sun-menu">
        <div class="circle" id="circle-1">
            <h3 id="sun-menu-option-1"> Create Cloud</h3>
        </div>
        <div class="circle" id="circle-2">
            <div class="close-symbol" id="sun-menu-option-2">&times;</div>
        </div>
    </div>

    <div class="hidden menu" id="cloud-create-menu">
        <div class="row-1">
            <label for="cloud-create-name-input">Cloud name: </label>
            <input type="text" name="cloudname" id="cloud-create-name-input" placeholder="Work">
        </div>
        <div class="row-2">
            <button type="submit" id="cloud-create-menu-button">Create</button>
        </div>
    </div>

    <div class="hidden menu" id="cloud-edit-menu">
        <div class="row-1">
            <label for="cloud-edit-name-input">Cloud name: </label>
            <input type="text" name="cloudname" id="cloud-edit-name-input" placeholder="Work">
        </div>
        <div class="row-2">
            <button type="submit" id="cloud-edit-menu-button">Change</button>
        </div>
    </div>

</body>

</html>
