<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sky</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main id="main">
        <div class="logo">
            <h1>sky</h1>
        </div>

        <div class="cloud">
            <h3>very big title</h3>
        </div>

        <div class="sun" id="sun"></div>

        <div class="hidden" id="sun-menu">
            <div id="sun-menu-header">
                <h3>Sun Menu</h3>
                <button class="close-symbol" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <ul id="sun-menu-list">
                <li class="sun-menu-option" id="sun-menu-option-1">
                    <h3>Create a cloud</h3>
                </li>
            </ul>
        </div>
    </main>

</body>

</html>
