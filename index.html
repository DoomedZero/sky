<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sky</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="src/css/global.css">
    <link rel="stylesheet" href="src/css/home.css">

    <script type="module" src="src/js/script.js" defer></script>
</head>

<body>

    <div class="logo">
        <h1>sky</h1>
    </div>

    <div class="sun" id="sun">
        <h3 id="sun-indicator"> S </h3>
    </div>

    <main id="main">

    </main>

    <div class="" id="sun-menu">
        <div class="circle" id="circle-1">
            <h3 id="sun-menu-option-1"> Create Cloud</h3>
        </div>
    </div>

    <div class="menu" id="cloud-create-menu">
        <div class="row-1">
            <h3>Create a cloud</h3>
            <button class="close-menu" id="close-create-menu">x</button>
        </div>
        <div class="row-2">
            <label for="cloud-create-name-input">Cloud name: </label>
            <input type="text" name="cloudname" id="cloud-create-name-input" placeholder="Press i to focus">
        </div>
        <div class="row-3">
            <button class="menu-button"  type="submit" id="cloud-create-menu-button">Create</button>
        </div>
    </div>

    <div class="menu" id="cloud-edit-menu">
        <div class="row-1">
            <h3 id="edit-cloud-message"></h3>
            <div class="close-menu" id="close-edit-menu">x</div>
        </div>
        <div class="row-2">
            <label for="cloud-edit-name-input">Cloud name: </label>
            <input type="text" name="cloudname" id="cloud-edit-name-input" placeholder="Work">
        </div>
        <div class="row-3">
            <button class="menu-button" type="submit" id="cloud-edit-menu-button">Change</button>
        </div>
        <div class="row-4">
            <button class="menu-button" type="submit" id="cloud-delete-button">Delete</button>
        </div>
    </div>

</body>

</html>
